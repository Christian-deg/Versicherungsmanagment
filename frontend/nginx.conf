server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Größere Uploads: Versicherungsdokumente bis 80 MB (Backend-Limit) + Puffer;
    # Rechnungen sind backendseitig auf 10 MB begrenzt
    client_max_body_size 90M;

    # Security-Header
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # Defense-in-Depth: alle Assets sind lokal gebundelt; 'unsafe-inline' bei style-src
    # ist für Vuetify/ApexCharts (Laufzeit-Styles) nötig
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # API → Backend-Container
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 30s;
        # KI-Dokumentenanalyse (Vision + bis zu 3 Retries) kann mehrere Minuten
        # dauern — muss zum 300s-Timeout des Frontends (api.js) passen
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # SPA-Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
